name: Lint and Format Check

on:
  push:
    branches: [stable, main]
  pull_request:
    branches: [stable, main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv

      - name: Install lint dependencies
        run: uv sync --extra lint

      - name: Run pylint on scripts
        run: uv run pylint scripts --max-line-length=100
        continue-on-error: true

      - name: Run pylint on tests
        run: uv run pylint tests --max-line-length=100
        continue-on-error: true

  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.0
